name: Keka Clock Automation

on:
  schedule:
    - cron: '30 4 * * 1-5'
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Clock action'
        required: true
        default: 'in'
        type: choice
        options:
          - in
          - out

concurrency:
  group: keka-clock
  cancel-in-progress: true

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Restore cached Keka session
        id: cache-session
        uses: actions/cache@v5
        with:
          path: /tmp/keka-state.json
          key: keka-session-${{ github.ref_name }}
      - run: node scripts/keka-action.js
        env:
          KEKA_EMAIL: ${{ secrets.KEKA_EMAIL }}
          KEKA_PASSWORD: ${{ secrets.KEKA_PASSWORD }}
          KEKA_ACTION: ${{ inputs.action || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
